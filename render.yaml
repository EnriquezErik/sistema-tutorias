services:
  - type: web
    name: sistema-tutorias
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev && npm run verify:deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_MAX_AGE_SECONDS
        value: '43200'
