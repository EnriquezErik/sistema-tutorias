<! DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Asesorías - Docentes</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { --bs-primary: #1b396a; --bg-light: #f4f7fc; }
cuerpo { font-family: 'Inter', sans-serif; color-fondo: var(--bg-light); color: #2d3748; }
.card { borde: ninguno; caja-sombra: 0 4px 6px -1px rgba(0, 0, 0, 0.1); rayo-borde: 0.5rem; }
.btn-primary { background-color: var(--bs-primary); border-color: var(--bs-primary); }
.btn-primary:hover { color-fondo: #142a4f; color-borde: #142a4f; }
</estilo>
</cabeza>
<clase corporal="bg-light">

<nav class="navbar navbar-dark shadow-sm py-2" style="color-fondo: #1b396a !importante;" >
<div class="container-fluid px-4">
<span class="navbar-brand d-flex align-items-center gap-2 fs-6 fw-bold">
<i class="fa-solid fa-graduation-cap"></i> Portal de Registro de Tutorías (Docentes)
</span>
<span class="badge bg-light text-dark px-2 py-1 fw-semibold small">Periodo: May-Ago 2026</span>
</div>
</nav>

<div class="container-fluid px-3 my-3">
<div class="tarjeta p-3 p-lg-4 mx-auto" style="max-width: 1400px;" >
<div class="text-center mb-3">
<h4 class="fw-bold text-primary mb-1">Registro de Tutoría Individual</h4>
<p class="text-muted small mb-0">Complete los datos correspondientes a la sesión de asesoría impartida.</p>
</div>

<form id="tutorForm">
<div class="row g-2">
<div class="col-md-4">
<label class="form-label fw-semibold small mb-1">Tutor que atiende:</label>
<select class="form-select form-select-sm" id="tutor" required>
<option value="">Cargando tutores... </opción>
</select>
</div>

<div class="col-md-3">
<label class="form-label fw-semibold small mb-1">Matrícula:</label>
<input type="text" class="form-control form-control-sm" id="matricula" required placeholder="Ej. 12203000">
</div>

<div class="col-md-5">
<label class="form-label fw-semibold small mb-1">Nombre del alumno:</label>
<input type="text" class="form-control form-control-sm" id="nombre" required placeholder="Nombre completo del estudiante">
</div>

<div class="col-md-3">
<label class="form-label fw-semibold small mb-1">Sexo:</label>
<select class="form-select form-select-sm" id="sexo" required>
<valor opción="">Elegir opción</opción>
<valor opción="Hombre">Hombre</opción>
<valor opción="Mujer">Mujer</opción>
</select>
</div>

<div class="col-md-3">
<label class="form-label fw-semibold small mb-1">Carrera:</label>
<select class="form-select form-select-sm" id="carrera" requerido>
<valor de opción="">Elegir opción</opción>
<valor de opción="IAEV">IAEV</opción>
<valor opción="ICM">ICM</opción>
<valor de la opción="IRC">IRC</opción>
<valor de la opción="ISW/ITIID">ISW/ITIID</opción>
<valor de la opción="LTF">LTF</opción
> <valor de la opción="ISA">ISA</opción>
</select>
</div>

<div class="col-md-3">
<etiqueta clase="form-etiqueta fw-semibold small mb-1">Grupo: </label>
<input type="text" class="form-control form-control-sm" id="grupo" required placeholder="Ej. 4°A">
</div>

<div class="col-md-3">
<label class="form-label fw-semibold small mb-1">Turno:</label>
<select class="form-select form-select-sm" id="turno" required
> <valor de opción="">Elegir opción</opción>
<valor opción="Matutino">Matutino</opción
> <valor opción="Vespertino">Vespertino</opción>
</select>
</div>

<div class="col-md-4">
<label class="form-label fw-semibold small mb-1">Motivos de la tutoría:</label>
<select class="form-select form-select-sm" id="motivo" required>
<option value="">Elegir opción</opción>
<option value="Motivos académicos">Motivos académicos</option>
<valor de opción="Motivos familiares">Motivos familiares</opción>
<valor de opción="Motivos personales">Motivos personales</opción>
<valor de opción="Motivos sociales">Motivos sociales</opción>
</select>
</div>

<div class="col-md-2">
<etiqueta clase="form-etiqueta fw-seminegrita pequeña mb-1">Canalización: </label>
<select class="form-select form-select-sm" id="canalizacion" requerido>
<valor de opción="">Elegir</opción>
<valor de opción="Sí">Sí</opción>
<valor de opción="No">No</opción>
</select>
</div>

<div clase="col-md-6">
<label class="form-label fw-semibold small mb-1">Comentarios / Observaciones:</label>
<input type="text" class="form-control form-control-sm" id="comentarios" placeholder="Detalles relevantes de la sesión...">
</div>

<div class="col-12 text-center mt-3">
<button type="submit" class="btn btn-primary px-4 py-2 shadow-sm fw-semibold">
<i class="fa-solid fa-floppy-disk me-1"></i> Registrar Tutoría
</button>
</div>
</div>
</form>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script> función
async cargarTutores() {
try {
const res = await fetch('/api/tutores');
const tutores = await res.json();
const selectTutor = document.getElementById('tutor');
selectTutor.innerHTML = '<valor de opción="">Elegir opción</opción>';
tutores.forEach(t => { selectTutor.innerHTML += '<valor de opción="${t}">${t}</opción>'; });
} catch (err) { console.error('Error al cargar tutores:', err); }
}

document.getElementById('tutorForm').addEventListener('submit', async (e) => {
e.preventDefault();
const formData = {
tutor: document.getElementById('tutor').value,
matricula: document.getElementById('matricula').value,
nombre: document.getElementById('nombre'). value,
sexo: document.getElementById('sexo').value,
carrera: document.getElementById('carrera').value,
grupo: document.getElementById('grupo').value,
turno: document.getElementById('turno').value,
motivo: document.getElementById('motivo').value,
canalizacion: document.getElementById('canalización').value,
comentarios: document.getElementById('comentarios').value,
};

const response = await fetch('/api/tutorias', {
método: 'POST',
encabezados: { 'Content-Type': 'application/json' },
cuerpo: JSON.stringify(formData)
});

if (response.ok) {
alert('¡Tutoría registrada exitosamente y guardada en Excel!');
document.getElementById('tutorForm').reset();
} else { alert('Error al registrar la tutoría.'); }
});

window.onload = cargarTutores;
</script>
</body>
</html>
