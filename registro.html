<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <div class="text-center mb-3">
    <img src="img/LogoBis.png" alt="Logos institucionales" class="img-fluid" style="max-height: 70px;">
    </div>
    <title>Registro de Asesorías - Docentes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bs-primary: #1b396a; --bg-light: #f4f7fc; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-light); color: #2d3748; }
        .card { border: none; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); border-radius: 0.5rem; }
        .btn-primary { background-color: var(--bs-primary); border-color: var(--bs-primary); }
        .btn-primary:hover { background-color: #142a4f; border-color: #142a4f; }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark shadow-sm py-2" style="background-color: #1b396a !important;">
        <div class="container-fluid px-4">
            <span class="navbar-brand d-flex align-items-center gap-2 fs-6 fw-bold">
                <i class="fa-solid fa-graduation-cap"></i> Portal de Registro de Tutorías (Docentes)
            </span>
            <span class="badge bg-light text-dark px-2 py-1 fw-semibold small">Periodo: May-Ago 2026</span>
        </div>
    </nav>

    <div class="container-fluid px-3 my-3">
        <div class="card p-3 p-lg-4 mx-auto" style="max-width: 1400px;">
            <div class="text-center mb-3">
                <h4 class="fw-bold text-primary mb-1">Registro de Tutoría Individual</h4>
                <p class="text-muted small mb-0">Complete los datos correspondientes a la sesión de asesoría impartida.</p>
            </div>

            <form id="tutorForm">
                <div class="row g-2">
                    <div class="col-md-4">
                        <label class="form-label fw-semibold small mb-1">Tutor que atiende:</label>
                        <select class="form-select form-select-sm" id="tutor" required>
                            <option value="">Cargando tutores...</option>
                        </select>
                    </div>

                    <div class="col-md-8">
                        <label class="form-label fw-semibold small mb-1">Nombre del alumno:</label>
                        <input type="text" class="form-control form-control-sm" id="nombre" required placeholder="Nombre completo del estudiante">
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-semibold small mb-1">Sexo:</label>
                        <select class="form-select form-select-sm" id="sexo" required>
                            <option value="">Elegir opción</option>
                            <option value="Hombre">Hombre</option>
                            <option value="Mujer">Mujer</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-semibold small mb-1">Carrera:</label>
                        <select class="form-select form-select-sm" id="carrera" required>
                            <option value="">Elegir opción</option>
                            <option value="IAEV">IAEV</option>
                            <option value="ICM">ICM</option>
                            <option value="IRC">IRC</option>
                            <option value="ISW/ITIID">ISW/ITIID</option>
                            <option value="LTF">LTF</option>
                            <option value="ISA">ISA</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-semibold small mb-1">Grupo:</label>
                        <input type="text" class="form-control form-control-sm" id="grupo" required placeholder="Ej. 4°A">
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-semibold small mb-1">Turno:</label>
                        <select class="form-select form-select-sm" id="turno" required>
                            <option value="">Elegir opción</option>
                            <option value="Matutino">Matutino</option>
                            <option value="Vespertino">Vespertino</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold small mb-1">Motivos de la tutoría:</label>
                        <select class="form-select form-select-sm" id="motivo" required>
                            <option value="">Elegir opción</option>
                            <option value="Motivos académicos">Motivos académicos</option>
                            <option value="Motivos familiares">Motivos familiares</option>
                            <option value="Motivos personales">Motivos personales</option>
                            <option value="Motivos sociales">Motivos sociales</option>
                        </select>
                    </div>

                    <div class="col-md-2">
                        <label class="form-label fw-semibold small mb-1">Canalización:</label>
                        <select class="form-select form-select-sm" id="canalizacion" required>
                            <option value="">Elegir</option>
                            <option value="Sí">Sí</option>
                            <option value="No">No</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold small mb-1">Comentarios / Observaciones:</label>
                        <input type="text" class="form-control form-control-sm" id="comentarios" placeholder="Detalles relevantes de la sesión...">
                    </div>

                    <div class="col-12 text-center mt-3">
                        <button type="submit" class="btn btn-primary px-4 py-2 shadow-sm fw-semibold">
                            <i class="fa-solid fa-floppy-disk me-1"></i> Registrar Tutoría
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function cargarTutores() {
            try {
                const res = await fetch('/api/tutores');
                const tutores = await res.json();
                const selectTutor = document.getElementById('tutor');
                selectTutor.innerHTML = '<option value="">Elegir opción</option>';
                tutores.forEach(t => { selectTutor.innerHTML += `<option value="${t}">${t}</option>`; });
            } catch (err) { console.error('Error al cargar tutores:', err); }
        }

        document.getElementById('tutorForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = {
                nombre: document.getElementById('nombre').value,
                sexo: document.getElementById('sexo').value,
                carrera: document.getElementById('carrera').value,
                grupo: document.getElementById('grupo').value,
                turno: document.getElementById('turno').value,
                tutor: document.getElementById('tutor').value,
                motivo: document.getElementById('motivo').value,
                canalizacion: document.getElementById('canalizacion').value,
                comentarios: document.getElementById('comentarios').value,
            };

            const response = await fetch('/api/tutorias', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            });

            if (response.ok) {
                alert('¡Tutoría registrada exitosamente y guardada en Excel!');
                document.getElementById('tutorForm').reset();
            } else { alert('Error al registrar la tutoría.'); }
        });

        window.onload = cargarTutores;
    </script>
</body>
</html>
